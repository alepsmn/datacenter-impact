# Configuración de pytest para el proyecto.
[pytest]
# Los scripts hacen `import config` a pelo (se ejecutan desde scripts/).
# `pythonpath` añade esos directorios a sys.path al arrancar pytest, para que
# los tests puedan hacer `import extract_epri`, `import plot_impact`, etc.
# desde la raíz del repo.
pythonpath = scripts analysis

# Dónde viven los tests. Mantiene el descubrimiento acotado y explícito.
testpaths = tests

# Convenciones de descubrimiento (son los valores por defecto, explícitos
# aquí como documentación): ficheros test_*.py, funciones test_*.
python_files = test_*.py
python_functions = test_*
